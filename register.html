<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="register.js"></script>
    <title>Register</title>
</head>
<body>
    <div class="container" id="register-container">
        <div class="form-container">
            <div class="form-header">
                <h2>Register</h2>
                <p>or <a href="index.html">login to your account</a></p>
            </div>
            <form action="#" method="POST" id="register-form">
                <input type="email" name="email" placeholder="Email" id="email" required>
                <input type="password" name="password" placeholder="Password" id="password" required>
                <input type="tel" name="phone" placeholder="Phone Number" id="phone" required>
                <button type="submit">Register</button>
            </form>
            <div id="verification-message" style="display: none;">
                <h3>Verify Your Email</h3>
                <p>A verification email has been sent to <span id="email-display"></span></p>
                <p>Please check your inbox (and spam folder) and click the verification link.</p>
                <button id="check-verification">I've verified my email</button>
            </div>
        </div>
    </div>
</body>
</html>
